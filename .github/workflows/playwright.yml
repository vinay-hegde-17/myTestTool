name: Playwright Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_EMAIL: ${{ vars.TEST_EMAIL }}
      QA_TOKEN: ${{ secrets.QA_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Validate API test configuration
        shell: bash
        run: |
          test -n "$API_BASE_URL" || {
            echo "::error::Set the API_BASE_URL repository variable to a URL reachable from GitHub Actions."
            exit 1
          }
          test -n "$QA_TOKEN" || test -n "$TEST_EMAIL" || {
            echo "::error::Set the QA_TOKEN repository secret or the TEST_EMAIL repository variable."
            exit 1
          }

      - name: Run sanity tests
        run: npm run test:sanity

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: playwright-results
          path: |
            reports/allure-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
